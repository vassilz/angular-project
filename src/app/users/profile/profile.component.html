<form #form="ngForm" (ngSubmit)="editProfile(form)">
  <label for="firstName">First name:</label><br />
  <input
    type="text"
    id="firstName"
    name="firstName"
    #inputFirstName="ngModel"
    [(ngModel)]="firstName"
  />
  <br />
  <label for="lastName">Last name:</label><br />
  <input
    type="text"
    id="lastName"
    name="lastName"
    #inputLastName="ngModel"
    [(ngModel)]="lastName"
  />
  <br />
  <label for="pageSize">Page size:</label><br />
  <input
    type="number"
    id="pageSize"
    name="pageSize"
    #inputPageSize="ngModel"
    [(ngModel)]="pageSize"
  />
  <br />
  <br />
  <div class="actions">
    <button class="cancel" (click)="onCancel($event)">Cancel</button>
    <button [style]="{ backgroundColor: '#234465' }">Save</button>
  </div>
</form>

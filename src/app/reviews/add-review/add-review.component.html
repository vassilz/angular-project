<form #form="ngForm" (ngSubmit)="addReview(form)">
  <label for="rating">Rating:</label><br />
  <input
    type="number"
    id="rating"
    name="rating"
    placeholder="5"
    [class]="inputRating?.touched && inputRating?.errors?.['required'] ? 'input-error' : ''"
    #inputRating="ngModel"
    ngModel
    required
  />
  @if (inputRating?.touched) {
  <div>
    @if (inputRating?.errors?.['required']) {
    <p class="error">Rating is required.</p>
    }
  </div>
  }
  <br />
  <label for="text">Text:</label><br />
  <textarea
    [class]="inputText?.touched && inputText?.errors?.['minlength'] ? 'input-error' : ''"
    type="text"
    id="text"
    name="text"
    placeholder="Doe"
    #inputText="ngModel"
    rows="5"
    minlength="20"
    ngModel
  ></textarea>
  @if (inputText?.touched) {
  <div>
    @if (inputText?.errors?.['minlength']) {
    <p class="error">Review text must be at least 20 characters long.</p>
    }
  </div>
  }
  <br /><br />

  <!-- <button class="cancel" (click)="onCancel($event)">Cancel</button> -->
  <button
    [disabled]="form.invalid"
    [style]="{ backgroundColor: form.invalid ? 'grey' : '#234465' }"
  >
    Add
  </button>
</form>

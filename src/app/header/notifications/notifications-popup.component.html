<h2 mat-dialog-title>Hi {{ data.username }}</h2>
<mat-dialog-content>
  <p>Notifications:</p>
  <!-- <mat-form-field>
    <mat-label>Favorite Animal</mat-label>
    <input matInput [(ngModel)]="animal" />
  </mat-form-field> -->
  @for (notification of notifications(); track notification.id) {
  <div
    class="notification"
    [class]="notification.type"
    [class.unread]="!isRead(notification.id)"
    (click)="markAsRead(notification.id)"
  >
    <p>{{ notification.message }}</p>
  </div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="markAllAsRead()">Mark all as read</button>
  <button matButton (click)="onClose()">Ok</button>
</mat-dialog-actions>

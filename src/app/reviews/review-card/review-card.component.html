<div>{{ review().rating }}: {{ review().text }}</div>
<br />
by {{ user().firstName }} {{ user().lastName }}
{{ review().reviewDate | elapsedTime }}
<br />
<br />
{{ likesCount() }} people found this helpful
<br />
@if (isLoggedIn && review().userid !== user().uuid) { Was this review helpful?
<button
  (click)="isLikedByCurrentUser ? dislikeReview() : likeReview()"
  [style]="{ backgroundColor: isLikedByCurrentUser ? '#234465' : '' }"
>
  Yes
</button>
}

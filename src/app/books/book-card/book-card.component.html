<div
  [innerHTML]="book.name + ' by ' + book.author | highlightSearch : searchTerm"
></div>
@if (isLoggedIn) { @if (isFavorite) {
<div
  class="favorite-icon"
  (click)="toggleFavorite()"
  title="Remove from favorites"
>
  &#9733;
</div>
} @else {
<div class="favorite-icon" (click)="toggleFavorite()" title="Add to favorites">
  &#9734;
</div>
} }
<div class="rating">
  @if (reviews.length === 0) { No reviews yet } @else {
  {{ reviews | averageRating }} of 5, {{ reviews.length }} votes }
</div>
@if (isAdmin) {
<button class="edit-button" [routerLink]="'' + book.id + '/edit'">Edit</button>
<dialog #confirmDeletionDialog>
  Are you sure you want to delete this book?
  <button (click)="deleteBook()">OK</button>
  <button (click)="confirmDeletionDialog.close()">Cancel</button>
</dialog>
<button class="delete-button" (click)="onDelete()">Delete</button>
} @else {
<button class="details-button" [routerLink]="'' + book.id">Details</button>
}

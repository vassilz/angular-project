Name: {{ author()?.name }}
<p>Country: {{ author()?.country }}</p>
<p>Born: {{ author()?.birthDate | date }}</p>

Books: @for (book of books(); track book.id) {
<div>
  <a [routerLink]="['/books', book.id]">
    <h4>{{ book.name }}</h4>
  </a>
  <p>Published at: {{ book.publishDate | date }}</p>
  <p>Pages: {{ book.pagesCount }}</p>
</div>
}

<button class="back-button" routerLink="/authors">Back to overview</button>
